services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATA_DIR: /data
      # No FRONTEND_URL set here on purpose — Compose is for local dev, so
      # CORS stays open to any origin. Set it explicitly in production.
      # ADMIN_TOKEN, SMTP_* are read from a local .env file (see .env.example)
      # via env_file below, so nothing sensitive is hardcoded here.
    env_file:
      - ./backend/.env
    volumes:
      - backend_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend_data:
